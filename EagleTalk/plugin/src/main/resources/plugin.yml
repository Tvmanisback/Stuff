name: EagleTalk
version: 1.1.0
main: dev.tvman.eagletalk.EagleTalkPlugin
description: Enables and manages EaglerXServer's native Eaglercraft voice service.
author: Tvman
depend: [EaglercraftXServer]
commands:
  voice:
    description: EagleTalk voice chat configuration and status.
    usage: /voice [status|enable|disable|setup|help]
permissions:
  eagletalk.admin:
    description: Enable or disable the EaglerXServer native voice service.
    default: op
